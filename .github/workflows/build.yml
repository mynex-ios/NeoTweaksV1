
name: NeoTweaks IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip "*.zip" -d source

      - name: Find build script
        run: |
          find source -name build.sh

      - name: Build IPA
        run: |
          cd source/WQFiles-main
          chmod +x build.sh
          WQFILES_FINAL_IPA=NeoTweaks-build100.ipa bash build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoTweaks-IPA
          path: source/WQFiles-main/NeoTweaks-build100.ipa
