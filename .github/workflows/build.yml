
name: NeoTweaks IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Extract ZIP
        run: |
          mkdir source
          unzip "*.zip" -d source

      - name: Locate build script
        run: |
          find source -name build.sh
